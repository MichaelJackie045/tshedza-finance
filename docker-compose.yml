# Tshedza Finance — frontend only (backend is Supabase)
# UI: http://localhost:5173
#
# Set VITE_SUPABASE_* in .env (see frontend/.env.example) before build.

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      # Do not pass anon key as build arg; provide at runtime via environment or host secret injection.
    ports:
      - "5173:80"
