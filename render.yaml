# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tshedza-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    # Build from repo root using the root Dockerfile (copies backend/)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_UPLOAD_DIR
        value: /app/uploads
      - key: APP_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_FROM_EMAIL
        value: onboarding@resend.dev
      - key: NOTIFY_OPS_EMAIL
        sync: false
