server.port=8080
app.jwt-secret=${JAVA_BACKEND_JWT_SECRET:replace-with-a-long-random-secret-at-least-32-characters}
app.allowed-origins=${JAVA_BACKEND_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5173}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jackson.default-property-inclusion=non_null
