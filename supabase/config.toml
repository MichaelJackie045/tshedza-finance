# Tshedza Finance — Supabase local config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "tshedza-finance"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.admin-decide-application]
verify_jwt = true

[functions.payment-initiate]
verify_jwt = true

[functions.payment-complete]
verify_jwt = true

[functions.payment-cancel]
verify_jwt = true

[functions.make-repayment]
verify_jwt = true

[functions.send-contact]
verify_jwt = false

# Local Edge Function env only. Hosted secrets are set with `supabase secrets set`.
# Do not put API keys here. ALLOW_LOCAL_ORIGINS must stay off in production.
[edge_runtime.secrets]
MOCK_PAYMENTS_ENABLED = "true"
MOCK_CHECKOUT_BASE_URL = "http://localhost:5173/dashboard/repayments/checkout"
ALLOW_LOCAL_ORIGINS = "true"
